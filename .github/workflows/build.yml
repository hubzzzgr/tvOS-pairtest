name: Build TVPair
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tvpair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain details
        run: |
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/toolchain.txt
          swift --version | tee -a artifacts/toolchain.txt
          xcodebuild -showsdks | tee -a artifacts/toolchain.txt
      - name: Resolve dependencies
        run: |
          set -o pipefail
          swift package --package-path Packages/TVPairCore resolve 2>&1 | tee artifacts/dependencies.log
          xcodebuild -resolvePackageDependencies -project TVPair.xcodeproj -scheme TVPair 2>&1 | tee -a artifacts/dependencies.log
      - name: Core unit and protocol tests
        env:
          SWIFT_BACKTRACE: enable=yes
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          swift test --package-path Packages/TVPairCore 2>&1 | tee artifacts/tests.log
      - name: Archive iOS arm64 without signing
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild -project TVPair.xcodeproj -scheme TVPair -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/TVPair.xcarchive \
            -resultBundlePath artifacts/Archive.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 archive \
            2>&1 | tee artifacts/archive.log
      - name: Package unsigned IPA
        run: |
          mkdir -p build/unsigned/Payload
          cp -R build/TVPair.xcarchive/Products/Applications/TVPair.app build/unsigned/Payload/
          (cd build/unsigned && zip -qry ../../artifacts/TVPair-unsigned.ipa Payload)
          shasum -a 256 artifacts/TVPair-unsigned.ipa > artifacts/SHA256SUMS.txt
          printf '%s\n' 'UNSIGNED experimental iOS arm64 build. Not an App Store or directly installable signed IPA. Requires compatible local signing or LiveContainer import. Physical Apple TV pairing and iOS 27 / LiveContainer compatibility are not established by CI.' > artifacts/INSTALL.txt
          echo '### TVPair unsigned build' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/INSTALL.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Simulator launch smoke test
        run: |
          set -o pipefail
          xcodebuild -project TVPair.xcodeproj -scheme TVPair -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee artifacts/simulator.log
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Simulator/Build/Products/Debug-iphonesimulator/TVPair.app
          xcrun simctl launch "$DEVICE_ID" org.tvpair.pairtest | tee artifacts/launch.txt
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/TVPair-simulator.png
      - name: Upload unsigned app
        if: ${{ !cancelled() && hashFiles('artifacts/TVPair-unsigned.ipa') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TVPair-unsigned-arm64
          path: |
            artifacts/TVPair-unsigned.ipa
            artifacts/INSTALL.txt
            artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Upload diagnostics and simulator preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVPair-build-diagnostics
          path: |
            artifacts/*.log
            artifacts/*.txt
            artifacts/*.png
            artifacts/*.xcresult
          retention-days: 14
      - name: Collect test crash reports
        if: failure()
        run: |
          mkdir -p artifacts/crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name '*TVPair*' -exec cp {} artifacts/crash-reports/ \; 2>/dev/null || true
      - name: Upload test crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TVPair-test-crashes
          path: artifacts/crash-reports/
          if-no-files-found: ignore
